services:
  scan-service:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-127.0.0.1:8080}:8080"
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: "${CLAMAV_TIMEOUT_SECONDS:-30}"
      MAX_FILE_SIZE_BYTES: "${MAX_FILE_SIZE_BYTES:-26214400}"
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    platform: linux/amd64
    build:
      context: ./docker/clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s

volumes:
  clamav_data:
